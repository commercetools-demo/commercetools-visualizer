#import "./fragments/custom-object-fragment.graphql"

mutation DeleteCustomObject(
  $container: String
  $id: String
  $key: String
  $personalDataErasure: Boolean = false
  $version: Long
) {
  deleteCustomObject(
    id: $id
    key: $key
    version: $version
    container: $container
    personalDataErasure: $personalDataErasure
  ) {
    ...CustomObject
  }
}
